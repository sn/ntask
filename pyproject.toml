[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntask"
version = "1.1.3"
description = "A Python-native task runner with content-hash caching and DAG execution."
authors = [{name = "Sean Nieuwoudt", email = "sean@underwulf.com"}]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["task-runner", "build-system", "make", "just", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13.7",
    "xxhash>=3.4",
    "pathspec>=0.12",
    "anyio>=4.3",
    "watchfiles>=0.22",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "moto>=5.0",
]
s3 = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2.14"]
all = ["boto3>=1.34", "google-cloud-storage>=2.14"]

[project.scripts]
ntask = "ntask._cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ntask"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "google.*"]
ignore_missing_imports = true
